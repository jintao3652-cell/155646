name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Client selftest
        run: python main.py --selftest

  xconnect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S XConnect -B build/xconnect -A x64 -DXCONNECT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/xconnect --config Release --parallel
      - name: CTest
        run: ctest --test-dir build/xconnect -C Release --output-on-failure

  xconnect-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S XConnect -B build/xconnect -DXCONNECT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/xconnect --parallel
      - name: CTest
        run: ctest --test-dir build/xconnect --output-on-failure

  xconnect-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S XConnect -B build/xconnect -DXCONNECT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/xconnect --parallel
      - name: CTest
        run: ctest --test-dir build/xconnect --output-on-failure
