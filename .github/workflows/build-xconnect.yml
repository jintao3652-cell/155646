name: Build XConnect

on:
  workflow_dispatch:        # 手动触发
  push:
    paths:
      - 'XConnect/**'
      - '.github/workflows/build-xconnect.yml'
  pull_request:
    paths:
      - 'XConnect/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: XConnect-linux-x86_64
          - os: windows-latest
            artifact: XConnect-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # SDK 已内置仓库（XConnect/SDK，XPSDK 43.0，含头文件与 XPLM_64.lib）
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: XConnect

      - name: Build
        run: cmake --build build --config Release --parallel
        working-directory: XConnect

      - name: Verify artifact
        shell: bash
        run: |
          if [ -f build/XConnect.xpl ]; then echo "found at build/XConnect.xpl";
          elif [ -f build/Release/XConnect.xpl ]; then echo "found at build/Release/XConnect.xpl"; cp build/Release/XConnect.xpl build/XConnect.xpl;
          elif [ -f build/Debug/XConnect.xpl ]; then echo "found at build/Debug/XConnect.xpl"; cp build/Debug/XConnect.xpl build/XConnect.xpl;
          else echo "::error::XConnect.xpl not found"; exit 1; fi
        working-directory: XConnect

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: XConnect/build/XConnect.xpl
          if-no-files-found: error