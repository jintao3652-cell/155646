name: Build XConnect

on:
  workflow_dispatch:        # 手动触发
  push:
    paths:
      - 'XConnect/**'
      - '.github/workflows/build-xconnect.yml'
  pull_request:
    paths:
      - 'XConnect/**'

# 同一分支只保留最新一次运行，避免排队/并发积累产物
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: XConnect-linux-x86_64
          - os: windows-latest
            artifact: XConnect-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # labels.c 用 glPushMatrix/glScalef 放大呼号文本；Linux runner 默认
      # 只有运行期 libGL.so.1，没有 GL/gl.h 和链接用的 libGL.so 符号链接。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      # SDK 已内置仓库（XConnect/SDK，XPSDK 43.0，含头文件与 XPLM_64.lib）
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: XConnect

      - name: Build
        run: cmake --build build --config Release --parallel
        working-directory: XConnect

      - name: Verify artifact
        shell: bash
        run: |
          echo "--- build tree ---"
          find build -maxdepth 2 -type f 2>/dev/null || true
          if [ -f build/XConnect.xpl ]; then
            echo "found at build/XConnect.xpl"
          elif [ -f build/Release/XConnect.xpl ]; then
            echo "found at build/Release/XConnect.xpl"; cp build/Release/XConnect.xpl build/XConnect.xpl
          elif [ -f build/Debug/XConnect.xpl ]; then
            echo "found at build/Debug/XConnect.xpl"; cp build/Debug/XConnect.xpl build/XConnect.xpl
          elif [ -f build/XConnect.dll ]; then
            echo "found at build/XConnect.dll (dll suffix)"; cp build/XConnect.dll build/XConnect.xpl
          else
            echo "::error::XConnect.xpl not found (see build tree above)"
            exit 1
          fi
          ls -la build/XConnect.xpl
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "raw=open('build/XConnect.xpl','rb').read(); assert raw[:2]==b'MZ','not PE'; assert b'XPluginStart' in raw,'XPluginStart missing'; print('PE OK: MZ + XPluginStart export')"
          else
            python -c "raw=open('build/XConnect.xpl','rb').read(); assert raw[:4]==b'\\x7fELF','not ELF'; assert b'XPluginStart' in raw,'XPluginStart missing'; print('ELF OK: ELF + XPluginStart symbol')"
          fi
        working-directory: XConnect

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # GitHub Actions 产物存储配额满时上传会失败，但构建/测试已经通过，
        # 不应因此把整个任务判失败；配额恢复后产物会自动开始上传。
        continue-on-error: true
        # PR 不产出发布件，减少配额占用
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.artifact }}
          path: XConnect/build/XConnect.xpl
          if-no-files-found: error
          retention-days: 1